name: Android Play Store Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: App version name
        required: true
        default: '0.11.0'
      version_code:
        description: Android version code (must increase for Play updates)
        required: true
        default: '11'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-playstore.yml'
    tags:
      - 'android-v*'

permissions:
  contents: read

env:
  VERSION_NAME: ${{ github.event.inputs.version_name || '0.11.0' }}
  VERSION_CODE: ${{ github.event.inputs.version_code || '11' }}

jobs:
  android:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Street Hustle
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 / API 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript and Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Street Hustle app/store artwork
        run: npm run store:assets

      - name: Build offline mobile web bundle
        run: npm run mobile:prepare

      - name: Audit release bundle and store metadata
        run: npm run release:audit

      - name: Generate Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply Play Store Android configuration
        run: npm run android:patch

      - name: Configure optional release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/upload-keystore.jks"
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/upload-keystore.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_STATUS=SIGNED_WITH_UPLOAD_KEY" >> "$GITHUB_ENV"
          else
            echo "SIGNING_STATUS=UNSIGNED_RELEASE_AAB" >> "$GITHUB_ENV"
          fi

      - name: Build Android debug APK and release App Bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Record build information
        run: |
          {
            echo "Street Hustle Android build"
            echo "Package: com.asemahle2004.streethustle"
            echo "Version name: $VERSION_NAME"
            echo "Version code: $VERSION_CODE"
            echo "Target SDK: 36 (Android 16)"
            echo "Signing: $SIGNING_STATUS"
            echo "Commit: $GITHUB_SHA"
            echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > release-build-info.txt

      - name: List build outputs
        run: |
          find android/app/build/outputs -maxdepth 5 -type f -print

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: street-hustle-debug-apk-v${{ env.VERSION_NAME }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: street-hustle-playstore-aab-v${{ env.VERSION_NAME }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            release-build-info.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play Store graphic assets
        uses: actions/upload-artifact@v4
        with:
          name: street-hustle-playstore-graphics-v${{ env.VERSION_NAME }}
          path: store-assets/*
          if-no-files-found: error
          retention-days: 30
